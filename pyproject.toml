[tool.pytest.ini_options]
pythonpath = [".", "web-app"]
testpaths = ["web-app/backend/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Keep the coursework reference and experimental strategy formatting intact.
extend-exclude = ["auctioneer.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "benchmark.py" = ["E402"], "bots/*.py" = ["E711", "E712"] }

[tool.ruff.format]
exclude = ["auctioneer.py", "bots/u*.py", "bots/flat_bot*.py"]
