[tool.pytest.ini_options]
pythonpath = [".", "web-app"]
testpaths = ["web-app/backend/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Keep the coursework reference and experimental strategy formatting intact.
extend-exclude = ["auctioneer.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "benchmark.py" = ["E402"], "bots/*.py" = ["E711", "E712"] }

[tool.ruff.format]
exclude = [
    "auctioneer.py",
    "bots/adaptive_market_bidder.py",
    "bots/budget_reserve_bidder.py",
    "bots/collection_balancer.py",
    "bots/endgame_boost_bidder.py",
    "bots/fixed_bid_[0-9]*.py",
    "bots/fixed_bid_specialist.py",
    "bots/price_profile_bidder.py",
    "bots/q_learning_bidder.py",
    "bots/room_size_bidder.py",
    "bots/weighted_strategy_blend.py",
]
